</p><ul id="0c4461d4-0b6b-46c8-9ded-a53bee4cc1c6" class="bulleted-list" dir="auto"><li style="list-style-type:disc"><strong>Authoring Tool Accessibility Guidelines (ATAG)</strong></li></ul><figure id="0bc19ee5-a1b3-411d-9603-81973b520be5" dir="ltr"><a href="https://www.w3.org/WAI/standards-guidelines/atag/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Authoring Tool Accessibility Guidelines (ATAG) Overview</div><div class="bookmark-description">This page introduces the Authoring Tool Accessibility Guidelines (ATAG) web standard. Quick links to resources: Page Contents Authoring tools are software and services that &quot;authors&quot; (web developers, designers, writers, etc.) use to produce web content (static web pages, dynamic web applications, etc.). Examples of authoring tools are listed below under &quot; Who ATAG is for &quot;.</div></div><div class="bookmark-href"><img src="https://www.w3.org/favicon.ico" class="icon bookmark-icon"/>https://www.w3.org/WAI/standards-guidelines/atag/</div></div><img src="https://www.w3.org/WAI/assets/images/social-sharing-default.jpg" class="bookmark-image"/></a></figure><figure id="22362cb0-cacc-4b1d-ae82-e99213474b08" dir="ltr"><a href="https://www.w3.org/People/Matt/Papers/XML2003.html" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Accessibility and Content Management Systems</div><div class="bookmark-description">Content management systems (CMS) have evolved from the basic templating systems of the mid-90&#x27;s to enterprise-wide knowledge management tools and integrated collaboration applications. They have even taken on a personal touch through the introduction of mature weblogging systems. Content management will continue to be relevant because it represents a reasonable approach to the development and archiving of Web content in diverse organizations.</div></div><div class="bookmark-href"><img src="https://www.w3.org/favicon.ico" class="icon bookmark-icon"/>https://www.w3.org/People/Matt/Papers/XML2003.html</div></div></a></figure><p id="fedbdfe6-bae9-48de-8577-7cffcf6ca3f5" class="" dir="auto">
</p><details id="04f1a203-3f19-4044-b174-5d3e4d03fd06" open="" class="toggle" dir="auto"><summary>References</summary><div class="indented"><p id="502d4878-87f7-4eaa-abac-a20465f21c9b" class="" dir="auto"><strong>Topics</strong></p><figure id="240ee854-c127-44c4-91e3-6c8370f3740f" class="link-to-page"><a href="Accessibility/Accessible%20Rich%20Internet%20Applications%20-%20ARIA%20240ee854c12744c491e36c8370f3740f.html" data-notion-page-id="240ee854-c127-44c4-91e3-6c8370f3740f" data-notion-space-id="7a86cf93-c70e-4601-ac5b-01bc367f2bd6">Accessible Rich Internet Applications - ARIA</a></figure><p id="2e321747-bb6e-430e-8364-8d502e03781d" class="" dir="auto">
</p><p id="78c68787-34f1-4a43-9fed-ab37708a2552" class="" dir="auto"><strong>Keyboard Hover</strong></p><figure id="40e195e4-6ef4-419e-8dcf-bad924a29726" dir="ltr"><a href="https://accessibility.iu.edu/creating-content/web-content/keyboard.html" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Keyboard accessibility</div><div class="bookmark-description">Buttons, links and form controls All buttons, links, and form controls should be operable using the keyboard by default. This can be overridden by the use of certain scripts and HTML attributes if necessary, but that step is taken on a case-by-case basis.</div></div><div class="bookmark-href"><img src="https://assets.iu.edu/favicon.ico" class="icon bookmark-icon"/>https://accessibility.iu.edu/creating-content/web-content/keyboard.html</div></div><img src="https://assets.iu.edu/brand/3.2.x/trident-large.png" class="bookmark-image"/></a></figure><p id="79718696-652a-43bd-b0c3-bf34f4d37df4" class="" dir="auto">
</p><p id="0aef7910-2e03-4ff8-8337-4e7580ab7e45" class="" dir="auto"><strong>Articles</strong></p><figure id="56d557fa-a0da-4185-bbaa-037dfd58ab3f" dir="ltr"><a href="https://bradfrost.com/blog/post/enforcing-accessibility-best-practices-with-automatically-generated-ids/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Enforcing Accessibility Best Practices with Automatically-Generated IDs</div><div class="bookmark-description">One of the best things about design systems is you can create components that have design, development, accessibility, responsive, performance, etc best practices baked right into them. By taking care of the boring stuff, users of the design system don&#x27;t have to think about (or at least think as har</div></div><div class="bookmark-href"><img src="http://bradfrost.com/favicon.ico" class="icon bookmark-icon"/>https://bradfrost.com/blog/post/enforcing-accessibility-best-practices-with-automatically-generated-ids/</div></div><img src="http://bradfrost.com/wp-content/uploads/2019/03/number-input.gif" class="bookmark-image"/></a></figure><p id="a180f727-61b4-4fe7-8158-8e48d3e23c08" class="" dir="auto">Four things to get started</p><figure id="9e38e7e1-002e-40fd-a200-c11493eea410" dir="ltr"><a href="https://www.solidstart.info/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Solid Start</div><div class="bookmark-description">Are you a person that makes digital things for other people? Awesome-because this page is all about making things for people. There are four ways you can improve your creation for everybody. All four are testable, fixable and they improve usability for everybody. There is one big assumption in this guide.</div></div><div class="bookmark-href"><img src="https://www.solidstart.info/favicon.ico" class="icon bookmark-icon"/>https://www.solidstart.info/</div></div></a></figure><p id="d85050e4-933d-4d86-a71d-e4d053ea1bba" class="" dir="auto">
</p><figure id="506cb8af-bfa6-4f17-8a07-99c02d3b429d" dir="ltr"><a href="https://developer.apple.com/design/human-interface-guidelines/accessibility/overview/introduction/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Introduction - Accessibility - Human Interface Guidelines - Apple Developer</div><div class="bookmark-description">People use Apple&#x27;s accessibility features, such as reduced transparency, VoiceOver, and increased text size, to personalize how they interact with their devices in ways that work for them. An accessible app supports such personalizations by design and gives everyone a great user experience, regardless of their capabilities or how they use their devices.</div></div><div class="bookmark-href"><img src="https://developer.apple.com/favicon.ico?51002006191" class="icon bookmark-icon"/>https://developer.apple.com/design/human-interface-guidelines/accessibility/overview/introduction/</div></div><img src="https://developer.apple.com/design/human-interface-guidelines/ios/images/Reduce_Transparency.png" class="bookmark-image"/></a></figure><figure id="ae443c42-6a6d-493d-9ff4-c59d6853f5cf" dir="ltr"><a href="https://accessibility.digital.gov/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Accessibility for Teams</div><div class="bookmark-description">Everyone who works on government websites has a role to play in making federal resources accessible and inclusive. Choose the guide that fits your role: These roles are based on the roles we have at the Technology Transformation Services at GSA.</div></div><div class="bookmark-href"><img src="https://accessibility.digital.gov/assets/img/favicon-16x16.png" class="icon bookmark-icon"/>https://accessibility.digital.gov/</div></div><img src="https://accessibility.digital.gov/assets/img/a11y-icon.png" class="bookmark-image"/></a></figure><figure id="1911d06b-a556-4e2c-a961-815dd9cd1107" dir="ltr"><a href="https://www.a11yproject.com/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">a11y stands for accessibility</div><div class="bookmark-description">The A11Y Project is a community-driven effort to make digital accessibility easier.</div></div><div class="bookmark-href"><img src="https://www.a11yproject.com/favicon.ico" class="icon bookmark-icon"/>https://www.a11yproject.com/</div></div><img src="https://www.a11yproject.com/img/resources/accessibility-for-everyone.jpg" class="bookmark-image"/></a></figure><figure id="3dd6c8df-ce89-40dc-9548-3d8647badfa9" dir="ltr"><a href="https://www.w3.org/WAI/standards-guidelines/wcag/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Web Content Accessibility Guidelines (WCAG) Overview</div><div class="bookmark-description">Introducing the Web Content Accessibility Guidelines (WCAG), including WCAG 2.0 and WCAG 2.1. Quick links to resources: Page Contents Web Content Accessibility Guidelines (WCAG) is developed through the W3C process in cooperation with individuals and organizations around the world, with a goal of providing a single shared standard for web content accessibility that meets the needs of individuals, organizations, and governments internationally.</div></div><div class="bookmark-href"><img src="https://www.w3.org/favicon.ico" class="icon bookmark-icon"/>https://www.w3.org/WAI/standards-guidelines/wcag/</div></div></a></figure><figure id="b70b4cdb-1905-4708-bbbc-eb642b40865f" dir="ltr"><a href="https://www.accessibilityoz.com/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">AccessibilityOz</div><div class="bookmark-description">Overview of autoplay and video accessibility in social media Autoplay is a serious accessibility issue. We tested whether videos autoplayed on social media, as well as whether it was possible to turn off this feature. In addition, we tested whether the video could be paused by the mouse, keyboard and touch.</div></div><div class="bookmark-href"><img src="https://www.accessibilityoz.com/wp-content/themes/a11yoz/favicon.ico" class="icon bookmark-icon"/>https://www.accessibilityoz.com/</div></div><img src="https://www.accessibilityoz.com.au/wp-content/uploads/2014/08/Accessibility_Oz_Orange.png" class="bookmark-image"/></a></figure><figure id="f76212c5-7e88-4bf3-a10a-b4f3046f4ef6" dir="ltr"><a href="https://www.w3.org/WAI/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Home</div><div class="bookmark-description">The Accessibility Education and Outreach Working Group ( EOWG) has published the ATAG Report Tool . Authoring tools are software and services used to create web content - such as content management systems (CMS) and what-you-see-is-what-you-get (WYSIWYG) HTML editors. W3C&#x27;s Authoring Tool Accessibility Guidelines (ATAG) addresses making the authoring tools themselves accessible and helping authors create more accessible web content.</div></div><div class="bookmark-href"><img src="https://www.w3.org/favicon.ico" class="icon bookmark-icon"/>https://www.w3.org/WAI/</div></div><img src="https://www.w3.org/WAI/assets/images/social-sharing-default.jpg" class="bookmark-image"/></a></figure><figure id="44760cc7-4568-4d74-a0dc-28edb4affef3" dir="ltr"><a href="https://material.io/design/usability/accessibility.html#material-theming" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Material Design</div><div class="bookmark-description">Build beautiful, usable products faster. Material Design is an adaptable system-backed by open-source code-that helps teams build high quality digital experiences.</div></div><div class="bookmark-href"><img src="https://material.io/static/assets/favicon.ico" class="icon bookmark-icon"/>https://material.io/design/usability/accessibility.html#material-theming</div></div></a></figure><p id="12bdcc01-fb81-4b0a-9bfe-99526f05d494" class="" dir="auto">
</p><p id="66b5d6e6-252d-4a5c-a12d-ef2f5e66b5f0" class="" dir="auto"><strong>Figma Plugins</strong></p><figure id="f427367d-4fc9-40d4-b3db-a2f8fc32b883" dir="ltr"><a href="https://www.figma.com/blog/design-for-everyone-with-these-accessibility-focused-plugins/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Tackle accessibility in your designs with these useful plugins</div><div class="bookmark-description">Failing to thoroughly address accessibility in your design means a large demographic of users may be excluded from being able to use your product. Just specifying the right colors so that text has enough contrast, or providing a way for users to navigate your site with a keyboard can make all the difference in enabling them to use your product too.</div></div><div class="bookmark-href"><img src="https://static.figma.com/app/icon/1/favicon.ico" class="icon bookmark-icon"/>https://www.figma.com/blog/design-for-everyone-with-these-accessibility-focused-plugins/</div></div><img src="https://images.ctfassets.net/1khq4uysbvty/7kTrEfu4IT25Rdge5Wy5t/fa44bb8d2eb315de62c797592b02b712/Plugins_Of_The_Week_Accessibility.png?w=1200&amp;q=80" class="bookmark-image"/></a></figure><p id="ed3b3973-fc6c-4967-b768-c7a3e1f2303a" class="" dir="auto">
