</style><style>@import url('https://cdn.jsdelivr.net/npm/katex@0.16.25/dist/katex-swap.min.css')</style></head><body><article id="35243605-fa08-40be-9b6e-e2901931b5e5" class="page sans"><header><h1 class="page-title" dir="auto">Design Library</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure id="062f77e6-05d3-43bd-bcdd-02770c65f9c7" class="link-to-page"><a href="Design%20Library/Foundation%20062f77e605d343bdbcdd02770c65f9c7.html" data-notion-page-id="062f77e6-05d3-43bd-bcdd-02770c65f9c7" data-notion-space-id="7a86cf93-c70e-4601-ac5b-01bc367f2bd6">Foundation</a></figure><figure id="1765d6e3-64f8-425a-96ef-7064840b0898" class="link-to-page"><a href="Design%20Library/Components%201765d6e364f8425a96ef7064840b0898.html" data-notion-page-id="1765d6e3-64f8-425a-96ef-7064840b0898" data-notion-space-id="7a86cf93-c70e-4601-ac5b-01bc367f2bd6">Components</a></figure><details id="9006913c-e1ac-41d9-95c1-5333c8acc4e4" open="" class="toggle" dir="auto"><summary>References</summary><div class="indented"><figure id="cb1f83b3-6123-44be-bd5e-c40eccd503ee" dir="ltr"><a href="https://medium.com/airbnb-design/building-a-visual-language-behind-the-scenes-of-our-airbnb-design-system-224748775e4e" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Building a Visual Language</div><div class="bookmark-description">Working in software development and design, we are often required to ship one-off solutions. Sometimes we&#x27;re working within time constraints and sometimes we just haven&#x27;t yet agreed upon a path forward. These one-off solutions aren&#x27;t inherently bad, but if they aren&#x27;t built upon a solid foundation, we eventually find ourselves having to pay back accrued technical and design debts.</div></div><div class="bookmark-href"><img src="https://cdn-static-1.medium.com/_/fp/icons/favicon-rebrand-medium.3Y6xpZ-0FSdWDnPM3hSBIA.ico" class="icon bookmark-icon"/>https://medium.com/airbnb-design/building-a-visual-language-behind-the-scenes-of-our-airbnb-design-system-224748775e4e</div></div><img src="https://miro.medium.com/max/1200/1*ReqqLqbliiudjs984E7Faw.png" class="bookmark-image"/></a></figure><h3 id="efb4c7c2-9bc3-4806-9b30-9ef4a3fb370f" class="" dir="auto">Agnostic Design System</h3><figure id="3b737f25-41c8-41d2-b03d-77a6e943e0f2" dir="ltr"><a href="https://bradfrost.com/blog/post/managing-technology-agnostic-design-systems/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Managing Technology-Agnostic Design Systems</div><div class="bookmark-description">Users don&#x27;t care that one UI is built by Team A and another is built by Team B. Users don&#x27;t care if for one project the team followed a scrum process, while another project followed a kanban process. Users don&#x27;t care if React is powering this feature while Angular is powering another.</div></div><div class="bookmark-href"><img src="http://bradfrost.com/favicon.ico" class="icon bookmark-icon"/>https://bradfrost.com/blog/post/managing-technology-agnostic-design-systems/</div></div><img src="http://bradfrost.com/wp-content/uploads/2017/04/tech-bubbles.png" class="bookmark-image"/></a></figure><figure id="6de735bd-d334-4244-a7b1-ae690854a6da" dir="ltr"><a href="https://medium.com/salesforce-ux/beyond-components-a-design-system-to-support-multiple-frameworks-cb1e4d511f66" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Beyond Components: A Design System to Support Multiple Frameworks</div><div class="bookmark-description">So how did we build a design system that meets all of these needs? Most modern design systems are made up of reusable programmatic components, assembled in one or more functional markup languages and built on specific front-end application frameworks. But what happens when a system must support multiple application frameworks?</div></div><div class="bookmark-href"><img src="https://cdn-static-1.medium.com/_/fp/icons/favicon-rebrand-medium.3Y6xpZ-0FSdWDnPM3hSBIA.ico" class="icon bookmark-icon"/>https://medium.com/salesforce-ux/beyond-components-a-design-system-to-support-multiple-frameworks-cb1e4d511f66</div></div><img src="https://miro.medium.com/max/1200/1*h2UKUpA0wTmz4DAJyWDNJg.jpeg" class="bookmark-image"/></a></figure><figure id="b7c0604e-2280-4ee3-8616-14b1f2529c96" dir="ltr"><a href="https://hackernoon.com/design-systems-should-be-javascript-framework-agnostic-2a0c47129ec8" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Design Systems Should be JavaScript Framework Agnostic | Hacker Noon</div></div><div class="bookmark-href"><img src="https://hackernoon.com/favicon.ico" class="icon bookmark-icon"/>https://hackernoon.com/design-systems-should-be-javascript-framework-agnostic-2a0c47129ec8</div></div><img src="https://hackernoon.com/Devimg/story-image-default.png" class="bookmark-image"/></a></figure><figure id="248c8e00-b493-421d-9c2b-c6485e202d92" dir="ltr"><a href="https://uxplanet.org/how-to-create-a-design-system-for-white-label-apps-5350551ccf78" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">How to create a design system for white label apps</div><div class="bookmark-description">For the past two years, I have been working on a design system for Brightloom&#x27;s white label app business. Unlike most of design systems, it also needs to be highly rebrandable, scaleable, and accessible. A design system is a collection of reusable components, guided by clear standards, that can be assembled together to build a variety of applications.</div></div><div class="bookmark-href"><img src="https://miro.medium.com/fit/c/256/256/1*yCwNxLbyLoSw_NMnqGop0Q.png" class="icon bookmark-icon"/>https://uxplanet.org/how-to-create-a-design-system-for-white-label-apps-5350551ccf78</div></div><img src="https://miro.medium.com/max/1200/1*gxq7TLuNY85n704AuE3mwg.png" class="bookmark-image"/></a></figure><h3 id="83df231d-ba93-416e-9f7c-673458681d70" class="" dir="auto"><strong>Frameworks</strong></h3><figure id="5a1b6d97-7eee-4186-94ef-387700856ce2" dir="ltr"><a href="https://stenciljs.com/docs/stencil-for-design-systems" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Stencil for Design Systems - Stencil</div><div class="bookmark-description">There&#x27;s a lot that goes into creating amazing UI components. Performance, accessibility, cross-platform capabilities, and user experience (not only of the UI component itself but how it fits into the entire design system) all must be considered. These aspects take real effort to do well.</div></div><div class="bookmark-href"><img src="https://stenciljs.com/assets/icon/favicon.ico" class="icon bookmark-icon"/>https://stenciljs.com/docs/stencil-for-design-systems</div></div><img src="https://stenciljs.com/assets/img/stenciljs-og.png" class="bookmark-image"/></a></figure><h3 id="d8a5787e-1a8d-4e9a-ae63-1509020bdc86" class="" dir="auto"><strong>Web Components</strong></h3><figure id="f4179197-46a7-4da6-8f45-cbe4cee7fad7" dir="ltr"><a href="https://developer.mozilla.org/en-US/docs/Web/Web_Components" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Web Components</div><div class="bookmark-description">As developers, we all know that reusing code as much as possible is a good idea. This has traditionally not been so easy for custom markup structures - think of the complex HTML (and associated style and script) you&#x27;ve sometimes had to write to render custom UI controls, and how using them multiple times can turn your page into a mess if you are not careful.</div></div><div class="bookmark-href"><img src="https://developer.mozilla.org/static/img/favicon32.7f3da72dcea1.png" class="icon bookmark-icon"/>https://developer.mozilla.org/en-US/docs/Web/Web_Components</div></div><img src="https://developer.mozilla.org/static/img/opengraph-logo.72382e605ce3.png" class="bookmark-image"/></a></figure><h3 id="0d0fdcdf-d16f-4bee-a0bb-961e5b73bb01" class="" dir="auto"><strong>Design Systems Inspiration</strong></h3><figure id="73e8ca8b-0bdd-471a-a111-d75fe7704f1f" dir="ltr"><a href="https://www.gov.uk/guidance/government-design-principles#design-with-data" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Government Design Principles</div><div class="bookmark-description">Service design starts with identifying user needs. If you don&#x27;t know what the user needs are, you won&#x27;t build the right thing. Do research, analyse data, talk to users. Don&#x27;t make assumptions. Have empathy for users, and remember that what they ask for isn&#x27;t always what they need.</div></div><div class="bookmark-href"><img src="https://www.gov.uk/assets/static/favicon-8d811b8c3badbc0b0e2f6e25d3660a96cc0cca7993e6f32e98785f205fc40907.ico" class="icon bookmark-icon"/>https://www.gov.uk/guidance/government-design-principles#design-with-data</div></div><img src="https://www.gov.uk/assets/static/opengraph-image-a1f7d89ffd0782738b1aeb0da37842d8bd0addbd724b8e58c3edbc7287cc11de.png" class="bookmark-image"/></a></figure><figure id="7b2d18a9-9654-4f11-a425-c1b96aaabdf7" dir="ltr"><a href="https://developer.microsoft.com/en-us/fluentui#/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Home - Fluent UI</div><div class="bookmark-description">The official front-end framework for building experiences that fit seamlessly into Microsoft 365.</div></div><div class="bookmark-href"><img src="https://developer.microsoft.com/favicon.ico" class="icon bookmark-icon"/>https://developer.microsoft.com/en-us/fluentui#/</div></div></a></figure><h3 id="9c39392c-0732-4904-99bb-2a391994d429" class="" dir="auto"><strong>Resources</strong></h3><figure id="8701a650-4b3a-4160-8f28-80529beafc99" dir="ltr"><a href="https://www.designsystemsforfigma.com/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Design Systems For Figma</div><div class="bookmark-description">A collection of Design Systems for Figma from all over the globe.</div></div><div class="bookmark-href"><img src="https://assets.website-files.com/5f08a6a4b22d4a7ca3b0b630/5f08b1ccb02511bcda01b7a2_favicon-32.png" class="icon bookmark-icon"/>https://www.designsystemsforfigma.com/</div></div><img src="https://assets.website-files.com/5f08a6a4b22d4a7ca3b0b630/5f18a5844db54c3e79853bca_OG-image-main.png" class="bookmark-image"/></a></figure><h3 id="85b371ff-c219-49c5-9a6f-13d5142da9a5" class="" dir="auto"><strong>Articles</strong></h3><figure id="e1bc6b8a-8050-48dd-a3aa-09f6452d042b" dir="ltr"><a href="https://blog.bitsrc.io/7-tools-for-building-your-design-system-in-2020-452d9c9b3b8e" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">7 Tools for Building Your Design System in 2020</div><div class="bookmark-description">Legend has it that the first design system was introduced by NASA in 1976. Since then, design systems turned into a widely common practice used to standardize design and development of a visual language in multiple instances across different teams, projects and applications.</div></div><div class="bookmark-href"><img src="https://miro.medium.com/fit/c/256/256/1*ds6iXWSFwycgEjbhZiCB4A.png" class="icon bookmark-icon"/>https://blog.bitsrc.io/7-tools-for-building-your-design-system-in-2020-452d9c9b3b8e</div></div><img src="https://miro.medium.com/freeze/max/800/1*UPtMMr8C5HRNQHjMHlizSg.gif" class="bookmark-image"/></a></figure><h3 id="a804a110-fbf5-4ac6-8fef-3f44fed171ae" class="" dir="auto"><strong>Books and Literature</strong></h3><figure id="04e29d6a-0865-433f-98c2-21148bafe987" dir="ltr"><a href="https://www.designbetter.co/design-systems-handbook/building-design-system" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Design Systems Handbook</div><div class="bookmark-description">Modern design systems are the result of many years of evolution in the way we write front-end code. When I started my career, most sites were built with single-use, inefficient, fragile, and inconsistent front-end codebases. Through hard-won experience and many years of collaboration and iteration, front-end developers have established more sophisticated practices for writing and organizing our code.</div></div><div class="bookmark-href"><img src="https://www.designbetter.co/static/img/favicon@2x.png" class="icon bookmark-icon"/>https://www.designbetter.co/design-systems-handbook/building-design-system</div></div><img src="https://s3.amazonaws.com/designco-web-assets/uploads/2017/11/figure1-v2-min.jpg" class="bookmark-image"/></a></figure><figure id="240810dc-5810-4844-afca-4542ffe49bbb" dir="ltr"><a href="https://www.uxpin.com/create-design-system-guide" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Design Systems: Step-by-Step Guide to Creating Your Own</div><div class="bookmark-description">Design is more important than ever - and design systems have become a huge piece of what makes a company or product successful, especially in the hyper-competitive global software market. These companies have historically relied only on user experience as a key differentiator. This demand for better experiences puts immense pressure on designers across the globe.</div></div><div class="bookmark-href"><img src="https://www.uxpin.com/images/favicon.ico" class="icon bookmark-icon"/>https://www.uxpin.com/create-design-system-guide</div></div><img src="https://www.uxpin.com/images/homepage/ebooks/creating-a-design-system/og-image.jpg" class="bookmark-image"/></a></figure><figure id="0549bf45-0561-4ac6-97bd-8232e66dca4b" dir="ltr"><a href="https://www.uxpin.com/studio/blog/youre-creating-design-system-read-6-books/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">If You&#x27;re Creating a Design System, Read These 6 Books</div><div class="bookmark-description">At UXPin, we&#x27;ve spent the past few weeks building a Design System Solution (try it first with the early access program): ...as well as building our own design system. Design systems are complicated beasts. They require a change in the way we think about design, the way we structure our teams and run our processes.</div></div><div class="bookmark-href"><img src="https://studio.uxpincdn.com/studio/wp-content/themes/uxpin-juggernaut/img/favicon.ico" class="icon bookmark-icon"/>https://www.uxpin.com/studio/blog/youre-creating-design-system-read-6-books/</div></div><img src="https://studio.uxpincdn.com/studio/wp-content/uploads/2017/05/Screen-Shot-2017-05-26-at-8.24.00-PM.png" class="bookmark-image"/></a></figure><figure id="689e46c3-4ec6-445d-b196-8609b19c1930" dir="ltr"><a href="https://xd.adobe.com/ideas/wp-content/uploads/2020/03/Invent_with_Idean_Hack_the_design_system_1st_edition.pdf" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title"></div></div><div class="bookmark-href">https://xd.adobe.com/ideas/wp-content/uploads/2020/03/Invent_with_Idean_Hack_the_design_system_1st_edition.pdf</div></div></a></figure><figure id="b97300fc-338c-4ff1-a3b2-f948e9602143" dir="ltr"><a href="https://www.learnstorybook.com/design-systems-for-developers/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Design Systems for Developers</div><div class="bookmark-description">A guide that teaches professional developers how to transform component libraries into design systems and set up the production infrastructure used by leading frontend teams. Table of Contents React Follow along as we code a design system that&#x27;s inspired by Storybook&#x27;s own.</div></div><div class="bookmark-href"><img src="https://www.learnstorybook.com/icon-storybook.png" class="icon bookmark-icon"/>https://www.learnstorybook.com/design-systems-for-developers/</div></div><img src="https://learnstorybook.com/design-systems-for-developers/opengraph-cover.jpg" class="bookmark-image"/></a></figure><h3 id="d92cb155-8af1-4547-83e8-3b0afbdec9a0" class="" dir="auto"><strong>Accessibility</strong></h3><figure id="be5796a8-c0a3-4d57-88c5-f1934415ca40" dir="ltr"><a href="https://medium.com/eightshapes-llc/accessible-design-systems-dont-guarantee-accessible-products-3478e3a462ba" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">&quot;Accessible&quot; Design Systems Don&#x27;t Guarantee Accessible Products</div><div class="bookmark-description">In late 2016, I helped pitch a design system all the way up to executives that included the CEO, COO, CPO, Head of Design, and other peers. The pitch&#x27;s mood shifted when accessibility came up: &quot;Oh, our teams will make accessible products if they use the system? Sold!&quot;</div></div><div class="bookmark-href"><img src="https://cdn-static-1.medium.com/_/fp/icons/favicon-rebrand-medium.3Y6xpZ-0FSdWDnPM3hSBIA.ico" class="icon bookmark-icon"/>https://medium.com/eightshapes-llc/accessible-design-systems-dont-guarantee-accessible-products-3478e3a462ba</div></div><img src="https://miro.medium.com/max/1200/1*SgltNph5qroWshYAU3N0Cg.png" class="bookmark-image"/></a></figure><figure id="2ab9ffcb-c9b7-436e-b92a-db9877173a65" dir="ltr"><a href="https://www.carbondesignsystem.com/guidelines/accessibility/overview/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Accessibility</div><div class="bookmark-description">Accessible design not only helps users with disabilities; it provides better user experiences for everyone. An accessible product should: Give all users the same quality of experience Adapt to users and situations Carbon components follow the IBM Accessibility Checklist which is based on WCAG AA, Section 508, and European standards.</div></div><div class="bookmark-href"><img src="https://www.carbondesignsystem.com/favicon-32x32.png?v=4f1475528ba6e374dbebcd6877034ef5" class="icon bookmark-icon"/>https://www.carbondesignsystem.com/guidelines/accessibility/overview/</div></div><img src="https://www.carbondesignsystem.com/static/ogimage-324e43fd3b74f4ece4582018a067eb27.png" class="bookmark-image"/></a></figure><figure id="bcbb15dd-2a53-4e8d-a896-f866747f845c" dir="ltr"><a href="https://design-system.service.gov.uk/accessibility/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Accessibility</div><div class="bookmark-description">The GOV.UK Design System website and the codebase it uses, GOV.UK Frontend, is maintained by a team at the Government Digital Service (GDS). This page explains how the team works to ensure the Design System and Frontend are accessible. The GOV.UK Design System team wants as many people as possible to be able to use this website.</div></div><div class="bookmark-href"><img src="https://design-system.service.gov.uk/assets/images/favicon.ico" class="icon bookmark-icon"/>https://design-system.service.gov.uk/accessibility/</div></div><img src="https://design-system.service.gov.uk/assets/images/govuk-opengraph-image.png" class="bookmark-image"/></a></figure><h3 id="69edca98-dedf-4194-a3dc-968f99c1e06e" class="" dir="auto"><strong>Naming</strong></h3><figure id="b74119b8-5aea-49ad-ad12-224840367e10" dir="ltr"><a href="http://getbem.com/naming/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">BEM - Block Element Modifier</div><div class="bookmark-description">There are only two hard problems in Computer Science: cache invalidation and naming things - Phil Karlton Encapsulates a standalone entity that is meaningful on its own. While blocks can be nested and interact with each other, semantically they remain equal; there is no precedence or hierarchy.</div></div><div class="bookmark-href"><img src="http://getbem.com/assets/favicon.png" class="icon bookmark-icon"/>http://getbem.com/naming/</div></div><img src="http://getbem.com/assets/bem_black.png" class="bookmark-image"/></a></figure><h3 id="6a800d2a-8533-4e93-8f79-603c5f7e4b2b" class="" dir="auto">Tools</h3><figure id="839bccb1-bf1f-4acc-a0f4-59a76f862f0a" dir="ltr"><a href="https://www.chromatic.com/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Automatically review, test, and document Storybook</div><div class="bookmark-description">We make tools for frontend developers that automate the Storybook workflow. Chromatic helps you gather UI feedback, test across browsers, and generate usage docs, all in one shared cloud workspace.</div></div><div class="bookmark-href"><img src="https://www.chromatic.com/static/favicon/favicon-default.png" class="icon bookmark-icon"/>https://www.chromatic.com/</div></div><img src="https://www.chromatic.com/static/open-graph/og-home.jpg" class="bookmark-image"/></a></figure><h3 id="5d1c5dbc-6920-4f05-9732-d569e460ee9e" class="" dir="auto">QA</h3><figure id="b49d182c-ef77-48fe-89a7-a0b9e9941b61" dir="ltr"><a href="https://blog.prototypr.io/unboxing-a-design-system-component-a-step-by-step-guide-to-quality-assurance-106df86b60d6" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Unboxing a Design System Component. A step by step guide to Quality Assurance</div><div class="bookmark-description">The first box is the biggest one. This step is about providing us with a sense of location for that component and a whole overview of the system. How the changes we want to apply to the part will impact the whole.</div></div><div class="bookmark-href"><img src="https://miro.medium.com/fit/c/256/256/1*qyQKDMMD6-X_8biF_U-N-g.png" class="icon bookmark-icon"/>https://blog.prototypr.io/unboxing-a-design-system-component-a-step-by-step-guide-to-quality-assurance-106df86b60d6</div></div><img src="https://miro.medium.com/max/1200/1*sx3mrVmS3t7wnWbrvZDIQQ.png" class="bookmark-image"/></a></figure><p id="c813541f-bd2b-4466-8978-adcea184d4b6" class="" dir="auto">
</p></div></details></div></article><span class="sans" style="font-size:14px;padding-top:2em"></span></body></html>
