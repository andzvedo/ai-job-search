</p><p id="6704e89e-e837-4a35-b7fe-ddc3b6329c8a" class="" dir="auto"><strong>References</strong></p><figure id="32f8ae1d-e964-4cdd-a324-88dc46cc090c" dir="ltr"><a href="https://accessibility.digital.gov/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Accessibility for Teams</div><div class="bookmark-description">Everyone who works on government websites has a role to play in making federal resources accessible and inclusive. Choose the guide that fits your role: These roles are based on the roles we have at the Technology Transformation Services at GSA.</div></div><div class="bookmark-href"><img src="https://accessibility.digital.gov/assets/img/favicon-16x16.png" class="icon bookmark-icon"/>https://accessibility.digital.gov/</div></div><img src="https://accessibility.digital.gov/assets/img/a11y-icon.png" class="bookmark-image"/></a></figure><figure id="c0a9fe24-9fcd-4d4a-8f85-ed20e2ab6492" dir="ltr"><a href="https://www.a11yproject.com/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">a11y stands for accessibility</div><div class="bookmark-description">The A11Y Project is a community-driven effort to make digital accessibility easier.</div></div><div class="bookmark-href"><img src="https://www.a11yproject.com/favicon.ico" class="icon bookmark-icon"/>https://www.a11yproject.com/</div></div><img src="https://www.a11yproject.com/img/resources/accessibility-for-everyone.jpg" class="bookmark-image"/></a></figure><figure id="5010258d-91f8-45e1-b910-5b07ef594673" dir="ltr"><a href="https://www.w3.org/WAI/standards-guidelines/wcag/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Web Content Accessibility Guidelines (WCAG) Overview</div><div class="bookmark-description">Introducing the Web Content Accessibility Guidelines (WCAG), including WCAG 2.0 and WCAG 2.1. Quick links to resources: Page Contents Web Content Accessibility Guidelines (WCAG) is developed through the W3C process in cooperation with individuals and organizations around the world, with a goal of providing a single shared standard for web content accessibility that meets the needs of individuals, organizations, and governments internationally.</div></div><div class="bookmark-href"><img src="https://www.w3.org/favicon.ico" class="icon bookmark-icon"/>https://www.w3.org/WAI/standards-guidelines/wcag/</div></div></a></figure><figure id="5e6e3817-c6de-4554-b28a-ed669587b829" dir="ltr"><a href="https://www.accessibilityoz.com/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">AccessibilityOz</div><div class="bookmark-description">Overview of autoplay and video accessibility in social media Autoplay is a serious accessibility issue. We tested whether videos autoplayed on social media, as well as whether it was possible to turn off this feature. In addition, we tested whether the video could be paused by the mouse, keyboard and touch.</div></div><div class="bookmark-href"><img src="https://www.accessibilityoz.com/wp-content/themes/a11yoz/favicon.ico" class="icon bookmark-icon"/>https://www.accessibilityoz.com/</div></div><img src="https://www.accessibilityoz.com.au/wp-content/uploads/2014/08/Accessibility_Oz_Orange.png" class="bookmark-image"/></a></figure><figure id="0cc24589-ecf8-42af-b953-4d24bc3c5e79" dir="ltr"><a href="https://www.w3.org/WAI/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Home</div><div class="bookmark-description">The Accessibility Education and Outreach Working Group ( EOWG) has published the ATAG Report Tool . Authoring tools are software and services used to create web content - such as content management systems (CMS) and what-you-see-is-what-you-get (WYSIWYG) HTML editors. W3C&#x27;s Authoring Tool Accessibility Guidelines (ATAG) addresses making the authoring tools themselves accessible and helping authors create more accessible web content.</div></div><div class="bookmark-href"><img src="https://www.w3.org/favicon.ico" class="icon bookmark-icon"/>https://www.w3.org/WAI/</div></div><img src="https://www.w3.org/WAI/assets/images/social-sharing-default.jpg" class="bookmark-image"/></a></figure><p id="76233631-e678-4c39-bc28-2c4e77fb8eac" class="" dir="auto">
</p><p id="8177bfb6-bba5-4aaa-84bc-068efe088510" class="" dir="auto"><strong>Figma Plugins</strong></p><figure id="cbae0363-06a3-4d73-b610-50e5705cbb03" dir="ltr"><a href="https://www.figma.com/blog/design-for-everyone-with-these-accessibility-focused-plugins/" class="bookmark source"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Tackle accessibility in your designs with these useful plugins</div><div class="bookmark-description">Failing to thoroughly address accessibility in your design means a large demographic of users may be excluded from being able to use your product. Just specifying the right colors so that text has enough contrast, or providing a way for users to navigate your site with a keyboard can make all the difference in enabling them to use your product too.</div></div><div class="bookmark-href"><img src="https://static.figma.com/app/icon/1/favicon.ico" class="icon bookmark-icon"/>https://www.figma.com/blog/design-for-everyone-with-these-accessibility-focused-plugins/</div></div><img src="https://images.ctfassets.net/1khq4uysbvty/7kTrEfu4IT25Rdge5Wy5t/fa44bb8d2eb315de62c797592b02b712/Plugins_Of_The_Week_Accessibility.png?w=1200&amp;q=80" class="bookmark-image"/></a></figure><p id="df6c42de-9301-4ce2-8325-0f68690e32e1" class="" dir="auto">
